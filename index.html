<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TechLudo – Hogwarts Code Quest</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap">
  <style>
    /* Hogwarts theme: candle-lit dark, parchment text, gold accents. Minimal on purpose. */
    :root {
      color-scheme: dark;
      --bg: #0c0b10;
      --panel: #15131b;
      --panel2: #1d1a26;
      --line: rgba(201, 162, 75, .24);
      --line2: rgba(201, 162, 75, .5);
      --text: #ece3cf;
      --muted: #9a8f78;
      --gold: #c9a24b;
      --gold2: #e6c878;
      --red: #b3354a;
      --green: #3f9b6a;
      --head: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
      --body: 'EB Garamond', 'Palatino Linotype', Georgia, serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 18px/1.5 var(--body);
      background: radial-gradient(ellipse at 50% -10%, rgba(201, 162, 75, .14), transparent 55%), var(--bg);
    }

    h1,
    h2,
    h3 {
      font-family: var(--head);
      font-weight: 700;
      letter-spacing: .04em;
      margin: 0 0 .5em;
      line-height: 1.2
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--gold2)
    }

    h2 {
      font-size: 1.3rem
    }

    h3 {
      font-size: 1rem;
      color: var(--gold)
    }

    p {
      margin: 0 0 .6em
    }

    p:last-child {
      margin: 0
    }

    .sub {
      color: var(--muted)
    }

    .eyebrow {
      font: 500 .72rem var(--head);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold)
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 48px
    }

    .narrow {
      max-width: 620px
    }

    .hero {
      text-align: center;
      padding: 18px 0 22px
    }

    .hero p {
      margin-top: .4em
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .row.end {
      justify-content: flex-end;
      margin-top: 14px
    }

    .row.center {
      justify-content: center
    }

    .err {
      color: #ff8a9b;
      min-height: 1.2em;
      margin: 6px 0 0
    }

    /* buttons + inputs */
    .btn {
      font: 700 .85rem var(--head);
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 11px 20px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(#dcb961, #b38b35);
      color: #1a1405;
      transition: filter .15s, transform .15s;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold2);
      border-color: var(--line2)
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: .72rem
    }

    .btn.big {
      width: 100%;
      padding: 14px
    }

    input,
    select,
    textarea {
      width: 98%;
      font: inherit;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 13px;
      margin-top: 5px;
      margin-left: 4px;
    }

    input:focus,
    select:focus,
    textarea:focus,
    .btn:focus-visible,
    .opt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    /* tables */
    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line)
    }

    th {
      font: 500 .7rem var(--head);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--gold)
    }

    td.num,
    th.num {
      text-align: right
    }

    tr:last-child td {
      border-bottom: 0
    }

    .tbl {
      overflow-x: auto;
      padding: 8px 12px
    }

    /* home */
    .menu {
      display: grid;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto 16px
    }

    .foot {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .dbs {
      text-align: center;
      font-size: .85rem;
      color: var(--muted);
      margin-top: 16px
    }

    .rules {
      margin: 0;
      padding-left: 1.2em;
      color: var(--muted)
    }

    .rules li {
      margin: .25em 0
    }

    /* game */
    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      align-items: start
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
      background: var(--panel2)
    }

    .stat small {
      display: block;
      font: 500 .62rem var(--head);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .stat strong {
      font: 700 1.1rem var(--head);
      color: var(--gold2)
    }

    .hearts {
      color: #d0475a;
      letter-spacing: 2px
    }

    .hearts .x {
      color: #3b3646
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px
    }

    .tile {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
    }

    [data-c=Cpp] {
      --cc: #3f9b6a
    }

    [data-c=CS] {
      --cc: #d0475a
    }

    [data-c=Logic] {
      --cc: #f1edf8
    }

    [data-c=FAST] {
      --cc: #4a86e8
    }

    .tile[data-c] {
      border-color: var(--cc);
      background: color-mix(in srgb, var(--cc) 20%, var(--panel2))
    }

    .tag[data-c] {
      border-color: var(--cc)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 12px;
      font-size: .8rem;
      color: var(--muted)
    }

    .lg {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .lg i {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--cc);
      border: 1px solid rgba(255, 255, 255, .35)
    }

    .tile .n {
      position: absolute;
      top: 3px;
      left: 6px;
      font: normal .68rem var(--head);
      color: var(--muted)
    }

    .tile.fin {
      border-color: var(--gold);
      background: rgba(201, 162, 75, .22);
      box-shadow: 0 0 14px rgba(201, 162, 75, .25)
    }

    .tile.fin .n {
      color: var(--gold2)
    }

    .tokens {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .tokens.start {
      position: static;
      width: 36px;
      height: 36px
    }

    .startbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font: 500 .7rem var(--head);
      letter-spacing: .2em;
      text-transform: uppercase
    }

    .tok {
      width: 62%;
      max-width: 36px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 .9rem var(--head);
      color: #1a1405;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .6), 0 0 0 2px rgba(255, 240, 200, .25);
      background: radial-gradient(circle at 35% 30%, #f6e2a4, #b58a30);
    }

    .tokens.start .tok {
      width: 100%;
      max-width: none
    }

    .tok.hop {
      animation: hop .22s ease
    }

    @keyframes hop {
      50% {
        transform: translateY(-8px) scale(1.1)
      }
    }

    .die {
      font-size: 4.4rem;
      line-height: 1.1;
      text-align: center;
      color: var(--gold2)
    }

    .die.roll {
      animation: shake .18s infinite
    }

    @keyframes shake {
      25% {
        transform: rotate(-8deg)
      }

      75% {
        transform: rotate(8deg)
      }
    }

    .msg {
      text-align: center;
      color: var(--muted);
      min-height: 1.5em;
      margin: 6px 0 14px
    }

    .side .btn.ghost {
      margin-top: 8px;
      width: 100%
    }

    /* question modal */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(5, 4, 8, .8)
    }

    .dlg {
      width: min(640px, 100%);
      max-height: 94vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line2);
      border-radius: 14px;
      padding: 22px
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .tag {
      font: 500 .68rem var(--head);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold2);
      border: 1px solid var(--line2);
      border-radius: 99px;
      padding: 3px 10px
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .tnum {
      font: 700 1.4rem var(--head);
      color: var(--gold2);
      min-width: 2ch;
      text-align: right
    }

    .tnum.low {
      color: #ff8a9b
    }

    .tbar {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, .08);
      border-radius: 5px;
      overflow: hidden
    }

    .tbar i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--gold)
    }

    .tbar.low i {
      background: var(--red)
    }

    .q {
      font-size: 1.15rem;
      margin-bottom: 10px
    }

    pre {
      margin: 0 0 14px;
      padding: 12px 14px;
      overflow-x: auto;
      background: #0a090e;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: .88rem/1.5 ui-monospace, Consolas, Menlo, monospace;
      color: #e8dcc0
    }

    .opt {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      padding: 11px 14px;
      text-align: left;
      font: inherit;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--gold)
    }

    .opt kbd {
      font: 600 .75rem var(--head);
      color: var(--gold);
      border: 1px solid var(--line2);
      border-radius: 5px;
      padding: 1px 7px
    }

    .opt:disabled {
      cursor: default
    }

    .opt.off {
      opacity: .3
    }

    .opt.r {
      border-color: var(--green);
      background: rgba(63, 155, 106, .18)
    }

    .opt.w {
      border-color: var(--red);
      background: rgba(179, 53, 74, .2)
    }

    .fb {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line)
    }

    .fb.ok {
      border-color: var(--green)
    }

    .fb.bad {
      border-color: var(--red)
    }

    .fb strong {
      font: 700 .95rem var(--head);
      letter-spacing: .05em;
      color: var(--gold2)
    }

    .fb .loss {
      color: #ff8a9b
    }

    /* results, admin forms */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      text-align: center
    }

    .results div {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 6px;
      background: var(--panel2)
    }

    .results small {
      display: block;
      font: 500 .65rem var(--head);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .results strong {
      font: 700 1.5rem var(--head);
      color: var(--gold2)
    }

    .form label {
      display: block;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .9rem
    }

    .form label>* {
      margin-top: 4px
    }

    .f2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .bar select {
      width: auto
    }

    .bar input {
      flex: 1;
      min-width: 160px
    }

    .chip {
      font-size: .8rem;
      color: var(--gold2);
      border: 1px solid var(--line2);
      border-radius: 99px;
      padding: 1px 9px;
      white-space: nowrap
    }

    /* toast + sparkles */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 80;
      display: grid;
      gap: 8px;
      justify-items: center
    }

    .toast {
      background: var(--panel2);
      border: 1px solid var(--line2);
      color: var(--gold2);
      padding: 9px 16px;
      border-radius: 99px;
      font-size: .95rem
    }

    .conf {
      position: fixed;
      top: -2rem;
      z-index: 70;
      pointer-events: none;
      animation: fall 3.6s linear forwards
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg)
      }
    }

    @media (max-width: 820px) {
      .game {
        grid-template-columns: 1fr
      }

      .hud {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 16px
      }

      .dlg {
        padding: 16px
      }

      .f2 {
        grid-template-columns: 1fr
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    /* ============ ANIMATION & POLISH LAYER ============ */
    body {
      position: relative
    }

    #app {
      position: relative;
      z-index: 1
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px)
      }
    }

    @keyframes fadein {
      from {
        opacity: 0
      }
    }

    @keyframes fadeout {
      to {
        opacity: 0
      }
    }

    @keyframes shimmer {
      to {
        background-position: -250% 0
      }
    }

    /* ambient candle embers */
    #embers {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0
    }

    #embers i {
      position: absolute;
      bottom: -12px;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, #fff1c2, #c9a24b 55%, transparent 72%);
      animation: ember var(--d) linear var(--dl) infinite
    }

    @keyframes ember {
      0% {
        opacity: 0;
        translate: 0 0
      }

      12% {
        opacity: .85
      }

      100% {
        opacity: 0;
        translate: var(--x) -108vh
      }
    }

    /* screens: staggered entrance */
    .wrap>* {
      animation: rise .55s cubic-bezier(.2, .7, .2, 1) backwards
    }

    .wrap> :nth-child(2) {
      animation-delay: .07s
    }

    .wrap> :nth-child(3) {
      animation-delay: .14s
    }

    .wrap> :nth-child(4) {
      animation-delay: .21s
    }

    .wrap> :nth-child(5) {
      animation-delay: .28s
    }

    .wrap> :nth-child(6) {
      animation-delay: .35s
    }

    .wrap> :nth-child(n+7) {
      animation-delay: .42s
    }

    .hero .eyebrow {
      display: inline-block;
      animation: rise .8s .05s backwards
    }

    .hero h1 {
      background: linear-gradient(100deg, #c9a24b 25%, #fff3cf 42%, #c9a24b 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise .8s .15s backwards, shimmer 6s 1s linear infinite
    }

    .hero p {
      animation: rise .8s .3s backwards
    }

    .defeat .hero h1 {
      background: none;
      color: #ff8a9b;
      animation: rise .8s .15s backwards
    }

    .vict .hero h1 {
      filter: drop-shadow(0 0 14px rgba(230, 200, 120, .55))
    }

    /* buttons */
    .btn {
      position: relative;
      overflow: hidden;
      transition: transform .15s, filter .15s, box-shadow .25s, background .2s, border-color .2s
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform: translateX(-130%);
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .32) 50%, transparent 65%);
      transition: transform .6s
    }

    .btn:hover:not(:disabled)::after {
      transform: translateX(130%)
    }

    .btn:hover:not(:disabled) {
      box-shadow: 0 6px 22px rgba(201, 162, 75, .28)
    }

    .btn:active:not(:disabled) {
      transform: scale(.96)
    }

    @keyframes glow {
      50% {
        box-shadow: 0 0 22px rgba(201, 162, 75, .6)
      }
    }

    .btn.big:not(:disabled) {
      animation: glow 2s ease-in-out infinite
    }

    input,
    select,
    textarea {
      transition: border-color .2s, box-shadow .2s
    }

    input:focus,
    textarea:focus,
    select:focus {
      box-shadow: 0 0 0 3px rgba(201, 162, 75, .18)
    }

    /* hall of fame rows */
    .panel:not(.tbl) tbody tr {
      animation: rise .45s backwards
    }

    .panel:not(.tbl) tbody tr:nth-child(1) {
      animation-delay: .35s
    }

    .panel:not(.tbl) tbody tr:nth-child(2) {
      animation-delay: .42s
    }

    .panel:not(.tbl) tbody tr:nth-child(3) {
      animation-delay: .49s
    }

    .panel:not(.tbl) tbody tr:nth-child(4) {
      animation-delay: .56s
    }

    .panel:not(.tbl) tbody tr:nth-child(5) {
      animation-delay: .63s
    }

    .panel:not(.tbl) tbody tr:first-child td {
      color: var(--gold2);
      font-weight: 600;
      text-shadow: 0 0 12px rgba(230, 200, 120, .4)
    }

    /* board */
    @keyframes tilein {
      from {
        opacity: 0;
        transform: scale(.4) rotate(-8deg)
      }
    }

    .tile {
      animation: tilein .5s cubic-bezier(.2, 1.3, .4, 1) backwards;
      animation-delay: calc(var(--i, 1) * 16ms + .15s);
      transition: box-shadow .3s, background .3s
    }

    @keyframes curpulse {
      50% {
        box-shadow: 0 0 0 2px var(--gold2), 0 0 26px rgba(230, 200, 120, .75)
      }
    }

    .tile.cur {
      z-index: 1;
      box-shadow: 0 0 0 2px var(--gold2), 0 0 16px rgba(230, 200, 120, .5);
      animation: curpulse 1.8s ease-in-out infinite
    }

    @keyframes finpulse {
      50% {
        box-shadow: 0 0 26px rgba(201, 162, 75, .6)
      }
    }

    .tile.fin:not(.cur) {
      animation: tilein .5s cubic-bezier(.2, 1.3, .4, 1) backwards, finpulse 2.4s 1.2s ease-in-out infinite;
      animation-delay: calc(var(--i, 1) * 16ms + .15s), 1.2s
    }

    .tile.land::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 9px;
      border: 2px solid var(--gold2);
      pointer-events: none;
      animation: ripple .65s ease-out forwards
    }

    @keyframes ripple {
      to {
        transform: scale(1.5);
        opacity: 0
      }
    }

    @keyframes flashg {
      35% {
        box-shadow: 0 0 0 3px var(--green), 0 0 30px var(--green)
      }
    }

    @keyframes flashr {
      35% {
        box-shadow: 0 0 0 3px var(--red), 0 0 30px var(--red)
      }
    }

    .tile.good {
      animation: flashg .9s
    }

    .tile.bad {
      animation: flashr .9s
    }

    @keyframes boardshake {
      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(3px)
      }
    }

    .board.shake {
      animation: boardshake .45s
    }

    @keyframes bob {
      50% {
        translate: 0 -3px
      }

      T.last = {}; T.shown = S.score; T.hudEls = {};
      T.hud = h('div', {class: 'hud'}, ['Lives', 'Score', 'Turn', 'Tile'].map(k => h('div', {class: 'stat'}, h('small', {}, k), T.hudEls[k] = h('strong'))));
      T.prog = h('div', {class: 'prog', role: 'progressbar', 'aria-label': 'Journey progress', 'aria-valuemin': 0, 'aria-valuemax': N}, h('i')); T.die = h('div', {class: 'die', role: 'img', 'aria-label': 'Dice'}, '⚅'); T.msg = h('p', {class: 'msg'}, MSG);
      T.roll = h('button', {class: 'btn big', onclick: roll}, 'Roll dice');
      T.menu = h('button', {class: 'btn ghost', onclick: home}, 'Menu (progress is saved)'); T.end = h('button', {class: 'btn ghost', onclick: endEarly}, 'End game');
      view(h('main', {class: 'wrap'},
        h('div', {class: 'game'},
          h('section', {class: 'panel'}, T.hud, T.prog, board, h('div', {class: 'startbox'}, T.start, 'Start · exact roll needed on tile ' + N),
            h('div', {class: 'legend'}, CATS.map(c => h('span', {class: 'lg'}, h('i', {'data-c': c}), CN[c])))),
          h('aside', {class: 'side'}, h('div', {class: 'panel'}, T.die, T.msg, T.roll), T.menu, T.end))));
      paint()
    }

    function paint() {
      const L = T.last, E = T.hudEls, bump = el => pop(el.parentNode, 'bump', 500);
      if (L.lives !== S.lives) {const lost = L.lives != null && S.lives < L.lives; E.Lives.replaceChildren(hearts(S.lives, lost ? S.lives : -1)); if (lost) bump(E.Lives); L.lives = S.lives}
      if (L.score !== S.score) {const first = L.score == null; countTo(E.Score, first ? S.score : T.shown, S.score, 700); T.shown = S.score; if (!first) bump(E.Score); L.score = S.score}
      if (L.turn !== S.turn) {E.Turn.textContent = S.turn; if (L.turn != null) bump(E.Turn); L.turn = S.turn}
      if (L.pos !== S.pos) {E.Tile.textContent = S.pos + '/' + N; L.pos = S.pos}
      T.prog.firstChild.style.width = (S.pos / N * 100) + '%'; T.prog.setAttribute('aria-valuenow', S.pos);
      T.roll.disabled = busy || S.over; T.menu.disabled = busy; T.end.disabled = busy || S.over
    }

    async function roll() {
      if (busy || S.over) return; busy = true; paint();
      const d = 1 + rnd(6);
      T.die.classList.add('roll'); const iv = setInterval(() => {T.die.textContent = DIE[rnd(6)]; sfx.roll()}, 90);
      await sleep(800); clearInterval(iv); T.die.classList.remove('roll'); T.die.textContent = DIE[d - 1]; pop(T.die, 'land', 600);
      const from = S.pos, to = from + d; T.msg.textContent = `You rolled a ${d}.`;
      if (to > N) {toast(`Exact roll needed: you need ${N - from} or less`); return endTurn(false)}
      for (let k = from + 1; k <= to; k++) {S.pos = k; place(k); paint(); sfx.hop(); await sleep(220)}
      await sleep(200);
      fx(to, 'land'); S.pend = {from}; save();                 // question is open: leaving now counts as a timeout
      const r = await ask(to, from);
      if (!r.ok) {for (let k = to - 1; k >= from; k--) {place(k, 110); paint(); await sleep(110)} }
      paint();
      if (S.over) return finish();
      endTurn(r.ok && d === 6)
    }

    function endTurn(extra) {
      if (extra) toast('You rolled a six. Roll again!'); else S.turn++;
      busy = false; save(); T.msg.textContent = MSG; paint()
    }

    function pick(cat) {
      let pool = Q.map((_, i) => i).filter(i => Q[i][0] === cat && !S.used.includes(i));
      if (!pool.length) {S.used = S.used.filter(i => Q[i][0] !== cat); pool = Q.map((_, i) => i).filter(i => Q[i][0] === cat)}
      if (!pool.length) pool = Q.map((_, i) => i);
      const i = pool[rnd(pool.length)]; S.used.push(i); return Q[i]
    }

    /* Shows a question. The result (points, or life lost) is applied the instant it is answered or the timer hits 0. */
    function ask(tile, from) {
      return new Promise(res => {
        const cat = catOf(tile), [, text, code, ans, w1, w2, w3, ex] = pick(cat), pts = code ? 15 : 10;
        const opts = shuffle([ans, w1, w2, w3]); let done = false, iv = null;
        const num = h('strong', {class: 'tnum'}, SECS), bar = h('div', {class: 'tbar', role: 'progressbar', 'aria-label': 'Time remaining', 'aria-valuemin': 0, 'aria-valuemax': SECS, 'aria-valuenow': SECS}, h('i'));
        const fb = h('div', {class: 'fb', hidden: true, 'aria-live': 'assertive'});
        const bs = opts.map((o, i) => h('button', {class: 'opt', onclick: () => answer(i)}, h('kbd', {}, 'ABCD'[i]), h('span', {}, o)));
        const ll = h('button', {
          class: 'btn ghost sm', disabled: !S.ll, onclick: () => {
            if (done || !S.ll) return; S.ll = 0; ll.disabled = true; ll.textContent = '50:50 used';
            shuffle(bs.map((b, i) => i).filter(i => opts[i] !== ans)).slice(0, 2).forEach(i => {bs[i].disabled = true; bs[i].classList.add('off')})
          }
        }, S.ll ? '50:50 charm' : '50:50 used');
        const key = e => {const i = '1234'.indexOf(e.key), j = 'abcd'.indexOf(e.key.toLowerCase()), k = i >= 0 ? i : j; if (k >= 0 && !bs[k].disabled) answer(k)};
        document.addEventListener('keydown', key);
        const close = modal(h('div', {class: 'tags'}, h('span', {class: 'tag', 'data-c': cat}, CN[cat]), h('span', {class: 'tag'}, '+' + pts + ' pts'), h('span', {class: 'tag'}, 'Tile ' + tile)),
          h('div', {class: 'timer'}, h('div', {role: 'timer'}, num), bar), h('div', {class: 'q'}, text), code ? h('pre', {}, code) : null, h('div', {class: 'opts'}, bs), fb, h('div', {class: 'row end'}, ll));
        const answer = i => {
          if (done) return; done = true; clearInterval(iv);
          const ok = i >= 0 && opts[i] === ans, late = i < 0; let bonus = false;
          /* apply the result immediately: a timeout costs a life exactly like a wrong answer */
          S.pend = null;
          if (ok) {
            S.score += pts; S.ok++; S.streak++;
            if (S.streak % 3 === 0) {S.score += 10; bonus = true}
            if (tile === N) {S.over = true; S.won = true}
          } else {
            S.bad++; S.streak = 0; S.lives--; S.pos = from;
            if (S.lives <= 0) {S.over = true; S.lost = true}
          }
          if (S.over) record(); else save();
          bs.forEach((b, k) => {b.disabled = true; if (opts[k] === ans) b.classList.add('r'); else if (k === i) b.classList.add('w')}); ll.disabled = true;
          (ok ? sfx.ok : sfx.bad)(); feedback(ok, tile, close.el, bs[opts.indexOf(ans)], pts, bonus); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'bad');
          const nb = h('button', {class: 'btn', onclick: () => {document.removeEventListener('keydown', key); close(); res({ok})}}, S.won ? 'Enter the Great Hall' : 'Continue');
          fb.replaceChildren(...[h('strong', {}, ok ? `Correct · +${pts} points` : late ? "Time's up" : 'Not quite'),
          ok ? null : h('p', {}, 'Answer: ' + ans),
          ok ? null : h('p', {class: 'loss'}, S.lives > 0 ? `−1 life · ${S.lives} left` : 'No lives left'),
          bonus ? h('p', {}, 'Three in a row · +10 bonus') : null,
          h('p', {class: 'sub'}, ex), h('div', {class: 'row end'}, nb)].filter(Boolean)); nb.focus()
        };
        const end = Date.now() + SECS * 1000;
        iv = setInterval(() => {
          const l = (end - Date.now()) / 1000, rem = Math.max(0, Math.ceil(l));
          bar.firstChild.style.width = Math.max(0, l / SECS * 100) + '%'; bar.setAttribute('aria-valuenow', rem); num.textContent = rem;
          bar.classList.toggle('low', l <= 5); num.classList.toggle('low', l <= 5);
          if (l <= 0) answer(-1);
        }, 100);
      })
    }

    function endEarly() {
      if (busy) return; const close = modal(h('h2', {}, 'End the game?'), h('p', {}, 'Your score is kept in your stats, but only winners appear in the Hall of Fame.'),
        h('div', {class: 'row end'}, h('button', {class: 'btn ghost', onclick: () => close()}, 'Keep playing'), h('button', {class: 'btn', onclick: () => {close(); S.over = true; record(); finish()}}, 'End game')))
    }

    function finish() {
      const w = S.won, t = S.ok + S.bad;
      if (w) {sfx.win(); confetti()} else if (S.lost) sfx.bad();
      view(h('main', {class: 'wrap narrow'},
        h('header', {class: 'hero'}, h('span', {class: 'eyebrow'}, w ? 'Victory' : S.lost ? 'Defeat' : 'Quest ended'),
          h('h1', {}, w ? 'The Great Hall awaits' : S.lost ? 'Out of lives' : 'Quest ended'),
          h('p', {class: 'sub'}, w ? `${S.name}, you made it in ${S.turn} turns.` : S.lost ? `You fell on tile ${S.pos} of ${N}.` : `You stopped on tile ${S.pos} of ${N}.`)),
        h('section', {class: 'panel'}, h('div', {class: 'results'}, [['Score', S.score], ['Turns', S.turn], ['Right', S.ok], ['Wrong', S.bad], ['Accuracy', t ? Math.round(S.ok / t * 100) + '%' : '—']].map(([k, v]) => h('div', {}, h('small', {}, k), h('strong', {}, v))))),
        h('div', {class: 'row center'}, h('button', {class: 'btn', onclick: again}, 'Play again'), h('button', {class: 'btn ghost', onclick: home}, 'Menu'))));
      finishFx(w)
    }

    embers();
    boot();
  </script>
  <script>
    (() => {
      const intro = document.getElementById('cinemaIntro');
      const skip = document.getElementById('cinemaSkip');
      if (!intro) return;
      let dismissed = false;
      const dismiss = () => {
        if (dismissed) return;
        dismissed = true;
        intro.classList.add('leaving');
        window.setTimeout(() => intro.remove(), 1500);
      };
      if (skip) skip.addEventListener('click', dismiss);
      window.setTimeout(dismiss, 6800);
      document.addEventListener('keydown', e => {if (e.key === 'Escape') dismiss();}, {once: false});
      // Make each game/menu change feel like a new cinematic scene.
      const app = document.getElementById('app');
      if (app && 'MutationObserver' in window) {
        const observer = new MutationObserver(() => {
          const scene = app.firstElementChild;
          if (!scene) return;
          scene.classList.remove('cinema-scene-in');
          void scene.offsetWidth;
          scene.classList.add('cinema-scene-in');
        });
        observer.observe(app, {childList: true});
      }
    })();
  </script>
</body>
