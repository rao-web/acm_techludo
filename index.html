<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TechLudo – Hogwarts Code Quest</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap">
  <style>
    /* Hogwarts theme: candle-lit dark, parchment text, gold accents. Minimal on purpose. */
    :root {
      color-scheme: dark;
      --bg: #0c0b10;
      --panel: #15131b;
      --panel2: #1d1a26;
      --line: rgba(201, 162, 75, .24);
      --line2: rgba(201, 162, 75, .5);
      --text: #ece3cf;
      --muted: #9a8f78;
      --gold: #c9a24b;
      --gold2: #e6c878;
      --red: #b3354a;
      --green: #3f9b6a;
      --head: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
      --body: 'EB Garamond', 'Palatino Linotype', Georgia, serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 18px/1.5 var(--body);
      background: radial-gradient(ellipse at 50% -10%, rgba(201, 162, 75, .14), transparent 55%), var(--bg);
    }

    h1,
    h2,
    h3 {
      font-family: var(--head);
      font-weight: 700;
      letter-spacing: .04em;
      margin: 0 0 .5em;
      line-height: 1.2
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--gold2)
    }

    h2 {
      font-size: 1.3rem
    }

    h3 {
      font-size: 1rem;
      color: var(--gold)
    }

    p {
      margin: 0 0 .6em
    }

    p:last-child {
      margin: 0
    }

    .sub {
      color: var(--muted)
    }

    .eyebrow {
      font: 500 .72rem var(--head);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold)
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 48px
    }

    .narrow {
      max-width: 620px
    }

    .hero {
      text-align: center;
      padding: 18px 0 22px
    }

    .hero p {
      margin-top: .4em
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .row.end {
      justify-content: flex-end;
      margin-top: 14px
    }

    .row.center {
      justify-content: center
    }

    .err {
      color: #ff8a9b;
      min-height: 1.2em;
      margin: 6px 0 0
    }

    /* buttons + inputs */
    .btn {
      font: 700 .85rem var(--head);
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 11px 20px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(#dcb961, #b38b35);
      color: #1a1405;
      transition: filter .15s, transform .15s;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold2);
      border-color: var(--line2)
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: .72rem
    }

    .btn.big {
      width: 100%;
      padding: 14px
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    input:focus,
    select:focus,
    textarea:focus,
    .btn:focus-visible,
    .opt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    /* tables */
    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line)
    }

    th {
      font: 500 .7rem var(--head);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--gold)
    }

    td.num,
    th.num {
      text-align: right
    }

    tr:last-child td {
      border-bottom: 0
    }

    .tbl {
      overflow-x: auto;
      padding: 8px 12px
    }

    /* home */
    .menu {
      display: grid;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto 16px
    }

    .foot {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .dbs {
      text-align: center;
      font-size: .85rem;
      color: var(--muted);
      margin-top: 16px
    }

    .rules {
      margin: 0;
      padding-left: 1.2em;
      color: var(--muted)
    }

    .rules li {
      margin: .25em 0
    }

    /* game */
    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      align-items: start
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
      background: var(--panel2)
    }

    .stat small {
      display: block;
      font: 500 .62rem var(--head);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .stat strong {
      font: 700 1.1rem var(--head);
      color: var(--gold2)
    }

    .hearts {
      color: #d0475a;
      letter-spacing: 2px
    }

    .hearts .x {
      color: #3b3646
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px
    }

    .tile {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
    }

    [data-c=Cpp] {
      --cc: #3f9b6a
    }

    [data-c=CS] {
      --cc: #d0475a
    }

    [data-c=Logic] {
      --cc: #f1edf8
    }

    [data-c=FAST] {
      --cc: #4a86e8
    }

    .tile[data-c] {
      border-color: var(--cc);
      background: color-mix(in srgb, var(--cc) 20%, var(--panel2))
    }

    .tag[data-c] {
      border-color: var(--cc)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 12px;
      font-size: .8rem;
      color: var(--muted)
    }

    .lg {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .lg i {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--cc);
      border: 1px solid rgba(255, 255, 255, .35)
    }

    .tile .n {
      position: absolute;
      top: 3px;
      left: 6px;
      font: normal .68rem var(--head);
      color: var(--muted)
    }

    .tile.fin {
      border-color: var(--gold);
      background: rgba(201, 162, 75, .22);
      box-shadow: 0 0 14px rgba(201, 162, 75, .25)
    }

    .tile.fin .n {
      color: var(--gold2)
    }

    .tokens {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .tokens.start {
      position: static;
      width: 36px;
      height: 36px
    }

    .startbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font: 500 .7rem var(--head);
      letter-spacing: .2em;
      text-transform: uppercase
    }

    .tok {
      width: 62%;
      max-width: 36px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 .9rem var(--head);
      color: #1a1405;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .6), 0 0 0 2px rgba(255, 240, 200, .25);
      background: radial-gradient(circle at 35% 30%, #f6e2a4, #b58a30);
    }

    .tokens.start .tok {
      width: 100%;
      max-width: none
    }

    .tok.hop {
      animation: hop .22s ease
    }

    @keyframes hop {
      50% {
        transform: translateY(-8px) scale(1.1)
      }
    }

    .die {
      font-size: 4.4rem;
      line-height: 1.1;
      text-align: center;
      color: var(--gold2)
    }

    .die.roll {
      animation: shake .18s infinite
    }

    @keyframes shake {
      25% {
        transform: rotate(-8deg)
      }

      75% {
        transform: rotate(8deg)
      }
    }

    .msg {
      text-align: center;
      color: var(--muted);
      min-height: 1.5em;
      margin: 6px 0 14px
    }

    .side .btn.ghost {
      margin-top: 8px;
      width: 100%
    }

    /* question modal */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(5, 4, 8, .8)
    }

    .dlg {
      width: min(640px, 100%);
      max-height: 94vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line2);
      border-radius: 14px;
      padding: 22px
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .tag {
      font: 500 .68rem var(--head);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold2);
      border: 1px solid var(--line2);
      border-radius: 99px;
      padding: 3px 10px
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .tnum {
      font: 700 1.4rem var(--head);
      color: var(--gold2);
      min-width: 2ch;
      text-align: right
    }

    .tnum.low {
      color: #ff8a9b
    }

    .tbar {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, .08);
      border-radius: 5px;
      overflow: hidden
    }

    .tbar i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--gold)
    }

    .tbar.low i {
      background: var(--red)
    }

    .q {
      font-size: 1.15rem;
      margin-bottom: 10px
    }

    pre {
      margin: 0 0 14px;
      padding: 12px 14px;
      overflow-x: auto;
      background: #0a090e;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: .88rem/1.5 ui-monospace, Consolas, Menlo, monospace;
      color: #e8dcc0
    }

    .opt {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      padding: 11px 14px;
      text-align: left;
      font: inherit;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--gold)
    }

    .opt kbd {
      font: 600 .75rem var(--head);
      color: var(--gold);
      border: 1px solid var(--line2);
      border-radius: 5px;
      padding: 1px 7px
    }

    .opt:disabled {
      cursor: default
    }

    .opt.off {
      opacity: .3
    }

    .opt.r {
      border-color: var(--green);
      background: rgba(63, 155, 106, .18)
    }

    .opt.w {
      border-color: var(--red);
      background: rgba(179, 53, 74, .2)
    }

    .fb {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line)
    }

    .fb.ok {
      border-color: var(--green)
    }

    .fb.bad {
      border-color: var(--red)
    }

    .fb strong {
      font: 700 .95rem var(--head);
      letter-spacing: .05em;
      color: var(--gold2)
    }

    .fb .loss {
      color: #ff8a9b
    }

    /* results, admin forms */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      text-align: center
    }

    .results div {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 6px;
      background: var(--panel2)
    }

    .results small {
      display: block;
      font: 500 .65rem var(--head);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .results strong {
      font: 700 1.5rem var(--head);
      color: var(--gold2)
    }

    .form label {
      display: block;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .9rem
    }

    .form label>* {
      margin-top: 4px
    }

    .f2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .bar select {
      width: auto
    }

    .bar input {
      flex: 1;
      min-width: 160px
    }

    .chip {
      font-size: .8rem;
      color: var(--gold2);
      border: 1px solid var(--line2);
      border-radius: 99px;
      padding: 1px 9px;
      white-space: nowrap
    }

    /* toast + sparkles */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 80;
      display: grid;
      gap: 8px;
      justify-items: center
    }

    .toast {
      background: var(--panel2);
      border: 1px solid var(--line2);
      color: var(--gold2);
      padding: 9px 16px;
      border-radius: 99px;
      font-size: .95rem
    }

    .conf {
      position: fixed;
      top: -2rem;
      z-index: 70;
      pointer-events: none;
      animation: fall 3.6s linear forwards
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg)
      }
    }

    @media (max-width: 820px) {
      .game {
        grid-template-columns: 1fr
      }

      .hud {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 16px
      }

      .dlg {
        padding: 16px
      }

      .f2 {
        grid-template-columns: 1fr
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="toast" aria-live="polite"></div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script>
/* ===== BUILT-IN FALLBACK BANK (the MySQL database is used when available) =====
   QUESTION BANK: [category, question, code|null, CORRECT, wrong, wrong, wrong, explanation]
   Correct answer is listed first; the game shuffles the options. ===== */
/*Q*/let Q = [
      ["Cpp", "What is the output?", "int a = 10;\ncout << a++;\ncout << a;", "1011", "1111", "1010", "1110", "a++ yields the old value (10) first, then a becomes 11."],
      ["Cpp", "What is the output?", "cout << 7 / 2.0;", "3.5", "3", "3.0", "4", "One operand is a double, so there is no integer division."],
      ["Cpp", "What is the output?", "cout << 7 / 2 << \" \" << 7 % 2;", "3 1", "3.5 1", "4 1", "3 0", "Integer division gives 3 and % gives the remainder 1."],
      ["Cpp", "What is the output?", "char s[] = \"Hello\";\ncout << sizeof(s);", "6", "5", "4", "8", "5 letters plus the '\\0' terminator."],
      ["Cpp", "What is the output?", "for (int i = 0; i < 3; i++)\n    cout << i << \" \";", "0 1 2", "1 2 3", "0 1 2 3", "1 2", "i takes 0, 1, 2 and stops when it reaches 3."],
      ["Cpp", "What is the output?", "int x = 3;\nif (x = 0) cout << \"A\";\nelse cout << \"B\";", "B", "A", "AB", "Compile error", "x = 0 assigns 0 (false), so the else branch runs. A classic bug."],
      ["Cpp", "What is the output?", "int i = 5;\nwhile (i--)\n    cout << i;", "43210", "54321", "5432", "4321", "i-- tests the old value, then decrements before the body runs."],
      ["Cpp", "What is the output?", "cout << 'A' + 1;", "66", "B", "A", "'B'", "'A' + 1 is an int (65 + 1), and cout prints ints as numbers. Unlike printf with %c, no char conversion happens."],
      ["Cpp", "What is the output?", "char c = 'A';\nc++;\ncout << c;", "B", "66", "A", "'B'", "c stays a char, so cout prints the character B."],
      ["Cpp", "What is the output?", "int x = 10;\nint *p = &x;\n*p = 20;\ncout << x;", "20", "10", "An address", "Error", "*p = 20 writes through the pointer into x."],
      ["Cpp", "What is the output?", "string s = \"code\";\ncout << s.length();", "4", "5", "3", "8", "length() counts characters and not the terminator."],
      ["Cpp", "What is the output?", "int a = 5;\nint &r = a;\nr = 9;\ncout << a;", "9", "5", "14", "Error", "A reference is another name for a, so assigning to r changes a."],
      ["Cpp", "What is the output?", "cout << 10 / 4 << \" \" << 10 / 4.0;", "2 2.5", "2.5 2.5", "2 2", "3 2.5", "10 / 4 is integer division (2). 10 / 4.0 is floating point (2.5)."],
      ["Cpp", "What is the output?", "bool b = 5;\ncout << b;", "1", "5", "0", "true", "Any non-zero value converts to true, and cout prints a bool as 1 (without boolalpha)."],
      ["Cpp", "What is the output?", "int x = 5;\ncout << x / 2 * 2.0;", "4", "5", "2", "4.0", "x / 2 is 2 (integer), then 2 * 2.0 is the double 4, printed as 4."],
      ["CS", "What is decimal 10 in binary?", null, "1010", "1001", "1100", "1110", "8 + 2 = 10, so the bits are 1010."],
      ["CS", "What is the time complexity of binary search?", null, "O(log n)", "O(n)", "O(1)", "O(n²)", "Each step halves the search range."],
      ["CS", "Which data structure is LIFO (last in, first out)?", null, "Stack", "Queue", "Array", "Tree", "Think of a stack of plates."],
      ["CS", "Which data structure is FIFO (first in, first out)?", null, "Queue", "Stack", "Heap", "Binary tree", "The first element added is the first one removed, like a line at a counter."],
      ["CS", "Which data structure gives O(1) average lookup by key?", null, "Hash table", "Linked list", "Sorted array", "Stack", "A hash function maps the key straight to a bucket."],
      ["CS", "Which data structure does breadth-first search (BFS) use?", null, "Queue", "Stack", "Heap", "Hash table", "BFS explores level by level, so it needs FIFO order. DFS uses a stack."],
      ["CS", "Which sorting algorithm has O(n log n) time even in the worst case?", null, "Merge sort", "Bubble sort", "Insertion sort", "Selection sort", "Merge sort always splits in half and merges in linear time."],
      ["CS", "What does DNS do?", null, "Translates domain names to IP addresses", "Encrypts traffic", "Stores web pages", "Assigns MAC addresses", "It's the internet's phone book."],
      ["CS", "What is the default port for HTTPS?", null, "443", "80", "21", "22", "80 = HTTP, 21 = FTP, 22 = SSH."],
      ["CS", "Which Git command saves a snapshot of staged changes?", null, "git commit", "git push", "git clone", "git fork", "commit records; push uploads."],
      ["CS", "Which is an example of supervised learning?", null, "Classifying emails as spam using labelled examples", "Grouping customers by similarity with no labels", "Compressing an image", "Defragmenting a disk", "Supervised learning trains on inputs paired with known labels."],
      ["CS", "In machine learning, what is overfitting?", null, "The model memorises training data and does poorly on new data", "The model is too simple to learn anything", "Training finishes too quickly", "The dataset is too small to store", "An overfit model has low training error but high error on unseen data."],
      ["CS", "What does the Turing Test try to measure?", null, "Whether a machine can behave indistinguishably from a human", "How fast a processor runs", "How much memory a computer has", "Whether code compiles", "Alan Turing proposed it as a test of machine intelligence."],
      ["CS", "Which algorithm adjusts a neural network's weights using error gradients?", null, "Backpropagation", "Quick sort", "Dijkstra's algorithm", "Huffman coding", "Backpropagation pushes the error backwards to update each weight."],
      ["CS", "What is phishing?", null, "Tricking people into revealing secrets using fake messages or sites", "Flooding a server with traffic", "Guessing passwords by brute force", "Encrypting files for ransom", "It's social engineering, usually via email or a cloned login page."],
      ["CS", "Which defence best prevents SQL injection?", null, "Parameterised queries (prepared statements)", "Longer passwords", "Using HTTP instead of HTTPS", "Hiding the login button", "Parameters keep user input as data, never as SQL code."],
      ["CS", "What does XSS stand for?", null, "Cross-Site Scripting", "Extra Style Sheets", "eXtended Server Security", "Cross-Server Syntax", "Attackers inject script that runs in other users' browsers."],
      ["CS", "What does a firewall do?", null, "Filters network traffic using rules", "Compresses files", "Speeds up the CPU", "Recovers deleted data", "It allows or blocks packets based on configured rules."],
      ["CS", "Which of these is a hash function rather than an encryption algorithm?", null, "SHA-256", "AES", "RSA", "Caesar cipher", "Hashes are one-way. Encryption can be reversed with a key."],

    /* Leaving the page while a question is open counts as a timeout (so a refresh can't dodge the penalty). */
    function resume(sd) {
      S = sd;
      if (S.pend) {
        S.pos = S.pend.from; S.pend = null; S.bad++; S.streak = 0; S.lives--;
        if (S.lives <= 0) {S.over = true; S.lost = true; record(); return finish()}
        S.turn++; save(); toast('You left mid-question: counted as a timeout, −1 life')
      }
      game()
    }

    /* store the finished run: database when online, this browser otherwise */
    function record() {
      try {localStorage.removeItem(KEY)} catch { }
      if (S.ok + S.bad === 0) return;
      if (DB && S.nu) api('game_end', {mode: 'solo', turns: S.turn, players: [{name: S.name, nu_id: S.nu, score: S.score, ok: S.ok, bad: S.bad, won: S.won}]}).catch(() => toast('Could not save the score to the database'));
      else {const rs = ld('tl.runs', []); rs.push({name: S.name, score: S.score, turns: S.turn}); sv('tl.runs', rs.sort((a, b) => b.score - a.score || a.turns - b.turns).slice(0, 100))}
    }

    /* ===== board ===== */
    function tilePos(k) {const rows = Math.ceil(N / COLS), i = k - 1, r = Math.floor(i / COLS); let c = i % COLS; if (r % 2) c = COLS - 1 - c; return {r: rows - r, c: c + 1}}
    const place = pos => (pos ? T[pos] : T.start).append(T.tok);
    const hop = () => {T.tok.classList.remove('hop'); void T.tok.offsetWidth; T.tok.classList.add('hop')};

    function game() {
      busy = false; T = {};
      const board = h('div', {class: 'board', role: 'img', 'aria-label': 'Game board'});
      for (let k = 1; k <= N; k++) {
        const {r, c} = tilePos(k), hold = h('div', {class: 'tokens'});
        T[k] = hold; board.append(h('div', {class: 'tile' + (k === N ? ' fin' : ''), 'data-c': catOf(k), style: `grid-row:${r};grid-column:${c}`, title: (k === N ? 'The Great Hall' : 'Tile ' + k) + ' · ' + CN[catOf(k)]}, h('i', {class: 'n'}, k), hold))
      }
      T.start = h('div', {class: 'tokens start'});
      T.tok = h('div', {class: 'tok', title: S.name}, [...S.name][0].toUpperCase()); place(S.pos);
      T.hud = h('div', {class: 'hud'}); T.die = h('div', {class: 'die', role: 'img', 'aria-label': 'Dice'}, '⚅'); T.msg = h('p', {class: 'msg'}, 'Roll the dice to move.');
      T.roll = h('button', {class: 'btn big', onclick: roll}, 'Roll dice');
      T.menu = h('button', {class: 'btn ghost', onclick: home}, 'Menu (progress is saved)'); T.end = h('button', {class: 'btn ghost', onclick: endEarly}, 'End game');
      view(h('main', {class: 'wrap'},
        h('div', {class: 'game'},
          h('section', {class: 'panel'}, T.hud, board, h('div', {class: 'startbox'}, T.start, 'Start · exact roll needed on tile ' + N),
            h('div', {class: 'legend'}, CATS.map(c => h('span', {class: 'lg'}, h('i', {'data-c': c}), CN[c])))),
          h('aside', {class: 'side'}, h('div', {class: 'panel'}, T.die, T.msg, T.roll), T.menu, T.end))));
      paint()
    }

    function paint() {
      T.hud.replaceChildren(...[['Lives', hearts(S.lives)], ['Score', S.score], ['Turn', S.turn], ['Tile', S.pos + '/' + N]].map(([k, v]) => h('div', {class: 'stat'}, h('small', {}, k), h('strong', {}, v))));
      T.roll.disabled = busy || S.over; T.menu.disabled = busy; T.end.disabled = busy || S.over
    }

    async function roll() {
      if (busy || S.over) return; busy = true; paint();
      const d = 1 + rnd(6);
      T.die.classList.add('roll'); const iv = setInterval(() => {T.die.textContent = DIE[rnd(6)]; sfx.roll()}, 90);
      await sleep(800); clearInterval(iv); T.die.classList.remove('roll'); T.die.textContent = DIE[d - 1];
      const from = S.pos, to = from + d; T.msg.textContent = `You rolled a ${d}.`;
      if (to > N) {toast(`Exact roll needed: you need ${N - from} or less`); return endTurn(false)}
      for (let k = from + 1; k <= to; k++) {S.pos = k; place(k); hop(); sfx.hop(); await sleep(220)}
      await sleep(200);
      S.pend = {from}; save();                 // question is open: leaving now counts as a timeout
      const r = await ask(to, from);
      if (!r.ok) {for (let k = to - 1; k >= from; k--) {place(k); hop(); await sleep(110)} }
      paint();
      if (S.over) return finish();
      endTurn(r.ok && d === 6)
    }

    function endTurn(extra) {
      if (extra) toast('You rolled a six. Roll again!'); else S.turn++;
      busy = false; save(); T.msg.textContent = 'Roll the dice to move.'; paint()
    }

    function pick(cat) {
      let pool = Q.map((_, i) => i).filter(i => Q[i][0] === cat && !S.used.includes(i));
      if (!pool.length) {S.used = S.used.filter(i => Q[i][0] !== cat); pool = Q.map((_, i) => i).filter(i => Q[i][0] === cat)}
      if (!pool.length) pool = Q.map((_, i) => i);
      const i = pool[rnd(pool.length)]; S.used.push(i); return Q[i]
    }

    /* Shows a question. The result (points, or life lost) is applied the instant it is answered or the timer hits 0. */
    function ask(tile, from) {
      return new Promise(res => {
        const cat = catOf(tile), [, text, code, ans, w1, w2, w3, ex] = pick(cat), pts = code ? 15 : 10;
        const opts = shuffle([ans, w1, w2, w3]); let done = false, iv = null;
        const num = h('strong', {class: 'tnum'}, SECS), bar = h('div', {class: 'tbar', role: 'progressbar', 'aria-label': 'Time remaining', 'aria-valuemin': 0, 'aria-valuemax': SECS, 'aria-valuenow': SECS}, h('i'));
        const fb = h('div', {class: 'fb', hidden: true, 'aria-live': 'assertive'});
        const bs = opts.map((o, i) => h('button', {class: 'opt', onclick: () => answer(i)}, h('kbd', {}, 'ABCD'[i]), h('span', {}, o)));
        const ll = h('button', {
          class: 'btn ghost sm', disabled: !S.ll, onclick: () => {
            if (done || !S.ll) return; S.ll = 0; ll.disabled = true; ll.textContent = '50:50 used';
            shuffle(bs.map((b, i) => i).filter(i => opts[i] !== ans)).slice(0, 2).forEach(i => {bs[i].disabled = true; bs[i].classList.add('off')})
          }
        }, S.ll ? '50:50 charm' : '50:50 used');
        const key = e => {const i = '1234'.indexOf(e.key), j = 'abcd'.indexOf(e.key.toLowerCase()), k = i >= 0 ? i : j; if (k >= 0 && !bs[k].disabled) answer(k)};
        document.addEventListener('keydown', key);
        const close = modal(h('div', {class: 'tags'}, h('span', {class: 'tag', 'data-c': cat}, CN[cat]), h('span', {class: 'tag'}, '+' + pts + ' pts'), h('span', {class: 'tag'}, 'Tile ' + tile)),
          h('div', {class: 'timer'}, h('div', {role: 'timer'}, num), bar), h('div', {class: 'q'}, text), code ? h('pre', {}, code) : null, h('div', {class: 'opts'}, bs), fb, h('div', {class: 'row end'}, ll));
        const answer = i => {
          if (done) return; done = true; clearInterval(iv);
          const ok = i >= 0 && opts[i] === ans, late = i < 0; let bonus = false;
          /* apply the result immediately: a timeout costs a life exactly like a wrong answer */
          S.pend = null;
          if (ok) {
            S.score += pts; S.ok++; S.streak++;
            if (S.streak % 3 === 0) {S.score += 10; bonus = true}
            if (tile === N) {S.over = true; S.won = true}
          } else {
            S.bad++; S.streak = 0; S.lives--; S.pos = from;
            if (S.lives <= 0) {S.over = true; S.lost = true}
          }
          if (S.over) record(); else save();
          bs.forEach((b, k) => {b.disabled = true; if (opts[k] === ans) b.classList.add('r'); else if (k === i) b.classList.add('w')}); ll.disabled = true;
          (ok ? sfx.ok : sfx.bad)(); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'bad');
          const nb = h('button', {class: 'btn', onclick: () => {document.removeEventListener('keydown', key); close(); res({ok})}}, S.won ? 'Enter the Great Hall' : 'Continue');
          fb.replaceChildren(h('strong', {}, ok ? `Correct · +${pts} points` : late ? "Time's up" : 'Not quite'),
            ok ? null : h('p', {}, 'Answer: ' + ans),
            ok ? null : h('p', {class: 'loss'}, S.lives > 0 ? `−1 life · ${S.lives} left` : 'No lives left'),
            bonus ? h('p', {}, 'Three in a row · +10 bonus') : null,
            h('p', {class: 'sub'}, ex), h('div', {class: 'row end'}, nb)); nb.focus()
        };
        const end = Date.now() + SECS * 1000;
        iv = setInterval(() => {
          const l = (end - Date.now()) / 1000, rem = Math.max(0, Math.ceil(l));
          bar.firstChild.style.width = Math.max(0, l / SECS * 100) + '%'; bar.setAttribute('aria-valuenow', rem); num.textContent = rem;
          bar.classList.toggle('low', l <= 5); num.classList.toggle('low', l <= 5);
          if (l <= 0) answer(-1);
        }, 100);
      })
    }

    function endEarly() {
      if (busy) return; const close = modal(h('h2', {}, 'End the game?'), h('p', {}, 'Your current score will still be saved to the Hall of Fame.'),
        h('div', {class: 'row end'}, h('button', {class: 'btn ghost', onclick: () => close()}, 'Keep playing'), h('button', {class: 'btn', onclick: () => {close(); S.over = true; record(); finish()}}, 'End game')))
    }

    function finish() {
      const w = S.won, t = S.ok + S.bad;
      if (w) {sfx.win(); confetti()} else if (S.lost) sfx.bad();
      view(h('main', {class: 'wrap narrow'},
        h('header', {class: 'hero'}, h('span', {class: 'eyebrow'}, w ? 'Victory' : S.lost ? 'Defeat' : 'Quest ended'),
          h('h1', {}, w ? 'The Great Hall awaits' : S.lost ? 'Out of lives' : 'Quest ended'),
          h('p', {class: 'sub'}, w ? `${S.name}, you made it in ${S.turn} turns.` : S.lost ? `You fell on tile ${S.pos} of ${N}.` : `You stopped on tile ${S.pos} of ${N}.`)),
        h('section', {class: 'panel'}, h('div', {class: 'results'}, [['Score', S.score], ['Turns', S.turn], ['Right', S.ok], ['Wrong', S.bad], ['Accuracy', t ? Math.round(S.ok / t * 100) + '%' : '—']].map(([k, v]) => h('div', {}, h('small', {}, k), h('strong', {}, v))))),
        h('div', {class: 'row center'}, h('button', {class: 'btn', onclick: () => newGame(S.name)}, 'Play again'), h('button', {class: 'btn ghost', onclick: home}, 'Menu'))))
    }

    boot();
  </script>
</body>

</html>
